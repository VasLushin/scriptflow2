name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK with Internet
        run: |
          flutter create --org com.scriptflow.app --project-name scriptflow app
          cd app
          flutter pub add http

          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          perms = '    \n    \n'
          c = c.replace('<manifest', perms + '<manifest', 1)
          c = c.replace('<application', '<application android:usesCleartextTraffic=\"true\"', 1)
          with open(p, 'w') as f: f.write(c)
          "

          cp ../main.dart lib/main.dart
          flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: ScriptFlow-Release-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
