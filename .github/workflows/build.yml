name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK with Full Permissions
        run: |
          flutter create --org com.scriptflow.app --project-name scriptflow app
          cd app
          flutter pub add http shared_preferences

          find android -name "AndroidManifest.xml" -exec sed -i '/\n    ' {} +
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' android/app/src/main/AndroidManifest.xml

          cp ../main.dart lib/main.dart
          flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: ScriptFlow-Release-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
