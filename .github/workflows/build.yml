name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Build APK
        run: |
          flutter create --org com.scriptflow.app --project-name scriptflow app
          cd app
          cat  pubspec.yaml
          name: scriptflow
          description: "ScriptFlow AI Teleprompter"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.1
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
          EOF
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScriptFlow-Release-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
